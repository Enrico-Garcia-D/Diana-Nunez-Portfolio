<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Diana Nuñez | Logo Designer</title>
    <meta name="description" content="Portfolio of Diana Nuñez, a logo and graphic designer crafting unique, memorable brand identities." />
    <meta property="og:title" content="Diana Nuñez | Logo Designer" />
    <meta property="og:description" content="Unique, memorable logos that represent your brand." />
    <meta name="theme-color" content="#f5efe6" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
